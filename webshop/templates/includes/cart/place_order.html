<div class="card h-100">
    <div class="card-body p-0">

        {% if cart_settings.enable_checkout %}
            <button
                class="btn btn-primary btn-place-order font-md w-100 mb-2"
                type="button">
                {{ _("Place Order") }}
            </button>

            <button
                class="btn btn-outline-primary btn-request-for-quotation font-md w-100"
                type="button">
                {{ _("Request for Quote") }}
            </button>
        {% else %}
            <button
                class="btn btn-primary btn-request-for-quotation font-md w-100"type="button">
                {{ _("Request for Quote") }}
            </button>
        {% endif %}

  </div>
</div>
