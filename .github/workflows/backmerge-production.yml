name: Back-merge production → develop

on:
  push:
    branches:
      - production

permissions:
  contents: write
  pull-requests: write

jobs:
  backmerge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Try merge production into develop
        id: merge
        run: |
          git checkout develop
          git pull origin develop
          git merge origin/production --no-ff -m "chore: auto back-merge production into develop" || echo "conflict=true" >> $GITHUB_OUTPUT

      - name: Push if merge succeeded
        if: steps.merge.outputs.conflict != 'true'
        run: git push origin develop

      - name: Create PR if merge failed
        if: steps.merge.outputs.conflict == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: back-merge production into develop"
          title: "🔁 Back-merge production → develop"
          body: "Automatic PR created because merge had conflicts. Please resolve manually."
          base: develop
          branch: auto/backmerge-production-to-develop
